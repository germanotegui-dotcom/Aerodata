<style>
:root{
  --bg:#f4f6f1; --card:#fff; --ink:#1d2a1f; --muted:#667066; --line:#e2e7dd;
  --green:#2f6b3a; --green2:#4f9a5a; --greenSoft:#e5f1e3; --amber:#b7791f; --amberSoft:#fbf0dc;
  --red:#b54036; --redSoft:#f8e3e0; --blue:#2c5d8a; --blueSoft:#e2ecf6;
  --radius:14px;
}
:root{color-scheme:light;--bg:#f7faf5;--line:#e3ebdf;--green:#3f8a4b;--green2:#3f8a4b;--greenSoft:#e8f4e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--green);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;color:var(--muted)}
header .grow{flex:1}
#sync{font-size:11px;background:var(--greenSoft);color:var(--green);padding:4px 8px;border-radius:20px}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--green2);font-weight:600}
h2{font-size:17px;margin:4px 2px 12px}
h3{font-size:14px;margin:18px 2px 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--muted);margin-top:3px}
.item .r{margin-left:auto;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--line);color:var(--ink)}
.p-green{background:var(--greenSoft);color:var(--green2)} .p-amber{background:var(--amberSoft);color:var(--amber)}
.p-red{background:var(--redSoft);color:var(--red)} .p-blue{background:var(--blueSoft);color:var(--blue)}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.toolbar input{flex:1;min-width:140px}.toolbar select{width:auto;flex:0 0 auto}
label{display:block;font-size:13px;color:var(--muted);margin:10px 2px 5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--green);color:#fff}
.btn.sec{background:var(--line);color:var(--ink)} .btn.danger{background:var(--redSoft);color:var(--red)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;margin-bottom:6px}.sheet .hd h2{margin:0;flex:1}
.x{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}.chk input{width:auto}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;font:inherit;font-size:13px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.banner{background:var(--amberSoft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.money-in{color:var(--green2);font-weight:600}.money-out{color:var(--red);font-weight:600}
.small{font-size:12px;color:var(--muted)}
.det div{margin:6px 0}.det b{color:var(--muted);font-weight:500;display:inline-block;min-width:110px}
</style>
</head>

const $=s=>document.querySelector(s);

const fmtF=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return `${dd}/${m}/${y}`};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function opts(arr,sel,blank){return (blank!==undefined?`<option value="">${esc(blank)}</option>`:"")+arr.map(o=>{const v=typeof o==="string"?o:o.v,l=typeof o==="string"?o:o.l;return `<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`}).join("")}
function totMon(list,f){const t={UYU:0,USD:0};list.forEach(x=>{t[x.moneda==="USD"?"USD":"UYU"]+=f(x)});return t}
function showTot(t){const p=[];if(t.UYU)p.push(fmt$(t.UYU,"UYU"));if(t.USD)p.push(fmt$(t.USD,"USD"));return p.length?p.join(" · "):"$ 0"}
const trabTotal=t=>num(t.total)||num(t.hectareas)*num(t.precioHa);

/* ---------- datos ---------- */
let _subscribed=false;const _meta={};
async function init(){
  render();
  window.addEventListener("online",updSync);window.addEventListener("offline",updSync);
  if(!window.FIREBASE_CONFIG||window.FIREBASE_CONFIG.apiKey==="PEGAR_AQUI"){S.noDb=true;S.noCfg=true;setSync("Falta configurar");render();return}
  let api=null;
  try{api=await Promise.race([window.__fb,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),20000))])}catch(e){}
  if(!api){S.noDb=true;setSync("Sin datos");render();return}
  S.api=api;
  api.onAuth(u=>{
    if(!u){showLogin();return}
    hideLogin();S.uid=u.uid;S.email=u.email||"";S.db=api;
    if(!_subscribed){_subscribed=true;COLS.forEach(col=>api.listen(col,(docs,meta)=>{S.data[col]=docs;_meta[col]=meta;S.loaded[col]=true;updSync();render()},err=>{toast(err?.code==="permission-denied"?"Tu usuario no tiene acceso a los datos":"Error al leer datos");setSync("Sin acceso")}))}
  });
}
function setSync(t){$("#sync").textContent=t}
function updSync(){
  if(!S.db)return;
  const pend=Object.values(_meta).some(m=>m&&m.hasPendingWrites);
  if(!navigator.onLine)setSync(pend?"Sin señal · guardado en el teléfono":"Sin señal");
  else setSync(pend?"Subiendo cambios…":"Sincronizado");
}
function resolveNames(){}
async function waitDoc(col,id,ver){for(let i=0;i<40;i++){const d=byId(col,id);if(d&&(!ver||d.actualizado===ver))return d;await new Promise(r=>setTimeout(r,50))}return null}
function writeErr(e){toast(e?.code==="permission-denied"?"Tu usuario no tiene permiso para guardar":"No se pudo guardar en la nube");}
async function save(col,id,obj){
  if(!S.db){toast("Iniciá sesión para guardar");return null}
  obj.actualizado=new Date().toISOString();
  if(!id){obj.creado=obj.actualizado;if(S.uid&&!obj.cargadoPor)obj.cargadoPor=S.uid}
  if(S.email&&!obj.cargadoPorEmail)obj.cargadoPorEmail=S.email;
  try{return S.db.write(col,id,obj,writeErr)}catch(e){writeErr(e);return null}
}
async function del(col,id){try{S.db.remove(col,id,writeErr);return true}catch(e){toast("No se pudo borrar");return false}}
/* ---------- login ---------- */
function showLogin(){
  const L=$("#login");L.style.display="flex";
  $("#lgBtn").onclick=async()=>{const em=$("#lgEmail").value.trim(),pw=$("#lgPass").value;$("#lgMsg").textContent="";
    if(!em||!pw){$("#lgMsg").textContent="Completá mail y contraseña";return}
    $("#lgBtn").disabled=true;$("#lgBtn").textContent="Entrando…";
    try{await S.api.login(em,pw)}catch(e){$("#lgMsg").textContent=!navigator.onLine?"La primera vez necesitás internet para entrar.":(/password|credential|user-not-found/.test(e?.code||"")?"Mail o contraseña incorrectos.":"No se pudo entrar ("+(e?.code||"error")+").")}
    $("#lgBtn").disabled=false;$("#lgBtn").textContent="Entrar"};
  $("#lgReset").onclick=async()=>{const em=$("#lgEmail").value.trim();if(!em){$("#lgMsg").textContent="Escribí tu mail arriba y tocá de nuevo.";return}
    try{await S.api.reset(em);$("#lgMsg").textContent="Te mandamos un mail para crear una contraseña nueva."}catch(e){$("#lgMsg").textContent="No se pudo enviar el mail."}};
}
function hideLogin(){$("#login").style.display="none"}
async function logout(){if(S.api){await S.api.logout();location.reload()}}
/* ---------- vistas ---------- */
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  $("#fab").style.display=(S.view==="inicio"||!S.canWrite||S.noDb)?"none":"block";
  const v=$("#view");
  const pre=S.noCfg?`<div class="banner">Falta pegar la configuración de Firebase en el archivo config.js (paso 4 de la guía).</div>`:S.noDb?`<div class="banner">No se pudo iniciar la app. Si es la primera vez que la abrís, conectate a internet.</div>`:(!S.canWrite?`<div class="banner">Tenés acceso solo de lectura. Pedí acceso de Editor para cargar datos.</div>`:"");
  v.innerHTML=pre+({inicio:vInicio,trabajos:vTrabajos,clientes:vClientes,finanzas:vFinanzas,equipos:vEquipos,presupuestos:vPresupuestos}[S.view])();
  bindView();
}
function vInicio(){
  const mes=hoy().slice(0,7),D=S.data;
  const tMes=D.trabajos.filter(t=>(t.fecha||"").startsWith(mes)&&(t.estado==="Realizado"||t.estado==="Entregado"));
  const ha=tMes.reduce((a,t)=>a+num(t.hectareas),0);
  const mMes=D.movimientos.filter(m=>(m.fecha||"").startsWith(mes));
  const ing=totMon(mMes.filter(m=>m.tipo==="ingreso"),m=>num(m.monto));
  const gas=totMon(mMes.filter(m=>m.tipo==="gasto"),m=>num(m.monto));
  const porCobrar=D.trabajos.filter(t=>(t.estado==="Realizado"||t.estado==="Entregado")&&t.pago!=="Pagado");
  const pc=totMon(porCobrar,trabTotal);
  const prox=D.trabajos.filter(t=>t.estado==="Programado"||t.estado==="Pendiente").sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9")).slice(0,5);
  const lim=new Date(Date.now()+15*864e5).toISOString().slice(0,10);
  const alertas=D.equipos.filter(e=>e.proxService&&e.proxService<=lim).sort((a,b)=>a.proxService.localeCompare(b.proxService));
  const mesTxt=new Date().toLocaleDateString("es-UY",{month:"long",year:"numeric"});
  return `<div style="text-align:center;margin:4px 0 14px"><img src="${LOGO}" alt="AeroData" style="width:170px;max-width:55%;height:auto"></div><h2>Resumen de ${esc(mesTxt)}</h2>
  <div class="kpis">
    <div class="kpi"><div class="l">Hectáreas trabajadas</div><div class="v">${fmtHa(ha)}</div><div class="s">${tMes.length} trabajo${tMes.length===1?"":"s"} realizado${tMes.length===1?"":"s"}</div></div>
    <div class="kpi"><div class="l">Por cobrar</div><div class="v" style="font-size:17px">${showTot(pc)}</div><div class="s">${porCobrar.length} trabajo${porCobrar.length===1?"":"s"}</div></div>
    <div class="kpi"><div class="l">Ingresos del mes</div><div class="v money-in" style="font-size:17px">${showTot(ing)}</div></div>
    <div class="kpi"><div class="l">Gastos del mes</div><div class="v money-out" style="font-size:17px">${showTot(gas)}</div></div>
  </div>
  <h3>Próximos trabajos</h3>
  ${prox.length?prox.map(itemTrabajo).join(""):`<div class="card small">No hay trabajos pendientes ni programados.</div>`}
  <h3>Mantenimiento próximo</h3>
  ${alertas.length?alertas.map(e=>`<div class="item" data-eq="${e.id}"><div class="row"><div><div class="t">${esc(e.nombre)}</div><div class="m">Service: ${fmtF(e.proxService)}</div></div><div class="r"><span class="pill ${e.proxService<hoy()?"p-red":"p-amber"}">${e.proxService<hoy()?"Vencido":"Próximo"}</span></div></div></div>`).join(""):`<div class="card small">Ningún equipo con service en los próximos 15 días.</div>`}
  ${S.email?`<div class="small" style="text-align:center;margin-top:24px">Sesión: ${esc(S.email)} · <a href="#" id="bLogout" style="color:var(--green)">Cerrar sesión</a></div>`:""}
  `;
}
function estadoPill(e){return `<span class="pill ${{Pendiente:"p-amber",Programado:"p-blue",Realizado:"p-green",Entregado:"p-green"}[e]||""}">${esc(e||"Pendiente")}</span>`}
function itemTrabajo(t){
  const tot=trabTotal(t);
  return `<div class="item" data-trab="${t.id}"><div class="row"><div style="min-width:0">
    <div class="t">${esc(cliName(t.clienteId))}${t.campo?` · ${esc(t.campo)}`:""}</div>
    <div class="m">${esc(t.servicio||"")}${t.hectareas?` · ${fmtHa(num(t.hectareas))}`:""}${t.fecha?` · ${fmtF(t.fecha)}`:""}</div></div>
    <div class="r">${estadoPill(t.estado)}<div class="small" style="margin-top:5px">${tot?fmt$(tot,t.moneda):""}${tot&&t.estado!=="Pendiente"&&t.estado!=="Programado"?(t.pago==="Pagado"?" ✓":" · debe"):""}</div></div></div></div>`;
}
function vTrabajos(){

  const buf=await wb.xlsx.writeBuffer();
  const fname=`Presupuesto ${p.numero||""} ${presCli(p)}`.replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim()+".xlsx";
  const XT="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";const blob=new Blob([buf],{type:XT});
  try{const file=new File([blob],fname,{type:XT});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});return}}catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Excel descargado");
}

/* ---------- navegación ---------- */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;history.replaceState(null,"","#"+S.view);render();window.scrollTo(0,0)});
$("#fab").onclick=()=>({trabajos:()=>formTrabajo(),clientes:()=>formCliente(),finanzas:()=>formMov(),equipos:()=>S.f.eqTab==="mant"?formMant():formEquipo(),presupuestos:()=>nuevoPres()}[S.view]||(()=>{}))();
const h=location.hash.slice(1);if(["inicio","trabajos","clientes","finanzas","equipos","presupuestos"].includes(h))S.view=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["inicio","trabajos","clientes","finanzas","equipos","presupuestos"].includes(h)&&h!==S.view){S.view=h;render()}});
init();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
